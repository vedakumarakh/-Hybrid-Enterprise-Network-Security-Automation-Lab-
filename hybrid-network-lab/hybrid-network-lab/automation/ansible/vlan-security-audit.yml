---
# ============================================================
# Ansible Playbook: VLAN Security Audit & Validation
# Project: Hybrid Enterprise Network Security Lab
# Author: Vedakumara K H
# Description: Audits VLAN configuration and checks for
#              misconfigurations like trunk mismatches,
#              native VLAN issues, and access port violations
# ============================================================

- name: VLAN Security Audit
  hosts: cisco_iosxr
  gather_facts: false
  connection: network_cli

  vars:
    audit_report_dir: "./audit-reports"
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    allowed_vlans: [10, 20, 30, 40, 100]  # Define allowed VLANs

  tasks:
    - name: Create audit report directory
      file:
        path: "{{ audit_report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Gather VLAN and interface information
      cisco.iosxr.iosxr_command:
        commands:
          - show vlan brief
          - show interfaces trunk
          - show spanning-tree summary
          - show cdp neighbors detail
      register: vlan_info

    - name: Check for native VLAN mismatch
      cisco.iosxr.iosxr_command:
        commands:
          - show interfaces trunk | include native
      register: native_vlan_check

    - name: Generate audit report
      copy:
        content: |
          ============================================================
          VLAN Security Audit Report
          Device: {{ inventory_hostname }}
          Date: {{ ansible_date_time.iso8601 }}
          ============================================================

          VLAN Summary:
          {{ vlan_info.stdout[0] }}

          Trunk Interfaces:
          {{ vlan_info.stdout[1] }}

          Spanning Tree Summary:
          {{ vlan_info.stdout[2] }}

          Native VLAN Status:
          {{ native_vlan_check.stdout[0] }}

          ============================================================
          Audit completed by Ansible automation
          ============================================================
        dest: "{{ audit_report_dir }}/VLAN-AUDIT-{{ inventory_hostname }}-{{ timestamp }}.txt"
      delegate_to: localhost

    - name: Print audit summary
      debug:
        msg:
          - "VLAN Audit completed for {{ inventory_hostname }}"
          - "Report saved to: {{ audit_report_dir }}/VLAN-AUDIT-{{ inventory_hostname }}-{{ timestamp }}.txt"
