! ============================================================
! Cisco ASA Firewall - Base Security Configuration
! Project: Hybrid Enterprise Network Security Lab
! Author: Vedakumara K H
! ============================================================

hostname ASA-FW-01
domain-name lab.vedakumara.local
enable password cisco123 encrypted

! --- Interface Configuration ---
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 192.168.10.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 192.168.20.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/3
 nameif management
 security-level 90
 ip address 10.0.0.1 255.255.255.0
 no shutdown

! --- Global Settings ---
dns server-group DefaultDNS
 name-server 8.8.8.8
 name-server 8.8.4.4

! --- NAT Configuration ---
object network INSIDE-NET
 subnet 192.168.10.0 255.255.255.0
 nat (inside,outside) dynamic interface

object network DMZ-NET
 subnet 192.168.20.0 255.255.255.0
 nat (dmz,outside) dynamic interface

! --- Access Control Lists ---
! Block inbound traffic from outside (deny all by default, allow specific)
access-list OUTSIDE-IN extended deny ip any any log
access-list OUTSIDE-IN extended permit tcp any host 203.0.113.10 eq 443
access-list OUTSIDE-IN extended permit tcp any host 203.0.113.10 eq 80
access-list OUTSIDE-IN extended permit icmp any any echo-reply

! Inside to Outside - allow all established
access-list INSIDE-OUT extended permit ip 192.168.10.0 255.255.255.0 any
access-list INSIDE-OUT extended deny ip any any log

! DMZ to Inside - deny all (DMZ should not initiate to inside)
access-list DMZ-TO-INSIDE extended deny ip 192.168.20.0 255.255.255.0 192.168.10.0 255.255.255.0 log
access-list DMZ-TO-INSIDE extended permit tcp 192.168.20.0 255.255.255.0 any eq 443

access-group OUTSIDE-IN in interface outside
access-group INSIDE-OUT in interface inside
access-group DMZ-TO-INSIDE in interface dmz

! --- IDS/IPS Policy ---
policy-map global_policy
 class inspection_default
  inspect dns preset_dns_map
  inspect ftp
  inspect h323 h225
  inspect h323 ras
  inspect http
  inspect icmp
  inspect netbios
  inspect rsh
  inspect rtsp
  inspect skinny
  inspect snmp
  inspect sqlnet
  inspect sunrpc
  inspect tftp
  inspect xdmcp
  inspect sip

service-policy global_policy global

! --- Site-to-Site VPN (to AWS) ---
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
 prf sha256
 lifetime seconds 86400

crypto ikev2 enable outside

tunnel-group 52.x.x.x type ipsec-l2l
tunnel-group 52.x.x.x ipsec-attributes
 ikev2 remote-authentication pre-shared-key AWS-VPN-KEY-HERE
 ikev2 local-authentication pre-shared-key AWS-VPN-KEY-HERE

crypto map OUTSIDE-MAP 10 match address VPN-ACL
crypto map OUTSIDE-MAP 10 set peer 52.x.x.x
crypto map OUTSIDE-MAP 10 set ikev2 ipsec-proposal AES256
crypto map OUTSIDE-MAP interface outside

access-list VPN-ACL extended permit ip 192.168.10.0 255.255.255.0 10.0.1.0 255.255.255.0

! --- Logging ---
logging enable
logging buffered informational
logging trap warnings
logging host inside 192.168.10.100

! --- SSH Hardening ---
ssh 192.168.10.0 255.255.255.0 inside
ssh 10.0.0.0 255.255.255.0 management
ssh version 2
ssh timeout 5
ssh key-exchange group dh-group14-sha256

aaa authentication ssh console LOCAL
username admin password cisco123 privilege 15

! --- SNMP for Monitoring ---
snmp-server community lab-read ro
snmp-server host inside 192.168.10.100 community lab-read version 2c
snmp-server enable traps all

! --- Banner ---
banner login ^
=====================================================
  AUTHORIZED ACCESS ONLY - Vedakumara Lab ASA FW
  Unauthorized access is strictly prohibited
=====================================================
^

end
