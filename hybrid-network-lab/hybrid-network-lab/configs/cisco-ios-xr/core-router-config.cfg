!! ============================================================
!! Cisco IOS-XR Router Configuration
!! Project: Hybrid Enterprise Network Security Lab
!! Router: CORE-RTR-01 (Simulates Airtel-style enterprise edge)
!! Author: Vedakumara K H
!! ============================================================

hostname CORE-RTR-01
domain name lab.vedakumara.local

!! --- Interface Configuration ---
interface GigabitEthernet0/0/0/0
 description "WAN - Uplink to ISP"
 ipv4 address 203.0.113.2 255.255.255.252
 no shutdown
!

interface GigabitEthernet0/0/0/1
 description "LAN - Core Switch Downlink"
 ipv4 address 192.168.1.1 255.255.255.0
 no shutdown
!

interface GigabitEthernet0/0/0/2
 description "MPLS L3VPN PE-CE Link"
 ipv4 address 10.10.10.1 255.255.255.252
 no shutdown
!

interface Loopback0
 description "Router-ID and MPLS LDP"
 ipv4 address 1.1.1.1 255.255.255.255
 no shutdown
!

!! --- OSPF Configuration ---
router ospf 1
 router-id 1.1.1.1
 area 0
  interface GigabitEthernet0/0/0/1
   cost 10
  !
  interface Loopback0
   passive
  !
 !
 redistribute connected subnets
 redistribute bgp 65001 subnets
!

!! --- BGP Configuration ---
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf 1
 !
 !
 neighbor 203.0.113.1
  remote-as 65000
  description "ISP Upstream BGP Peer"
  address-family ipv4 unicast
   route-policy ACCEPT-ALL in
   route-policy EXPORT-FILTER out
  !
 !
 neighbor 10.10.10.2
  remote-as 65002
  description "MPLS VPN CE Neighbor"
  address-family ipv4 unicast
   route-policy VPN-IMPORT in
   route-policy VPN-EXPORT out
  !
 !
!

!! --- MPLS Configuration ---
mpls ldp
 router-id 1.1.1.1
 interface GigabitEthernet0/0/0/0
 !
 interface GigabitEthernet0/0/0/2
 !
!

mpls traffic-eng tunnels
interface GigabitEthernet0/0/0/0
 mpls traffic-eng
!

!! --- VRF for L3VPN ---
vrf ENTERPRISE-VPN
 address-family ipv4 unicast
  import route-target
   65001:100
  !
  export route-target
   65001:100
  !
 !
!

!! --- Route Policies ---
route-policy ACCEPT-ALL
  pass
end-policy
!

route-policy EXPORT-FILTER
  if destination in (192.168.0.0/16 le 24) then
    pass
  else
    drop
  endif
end-policy
!

route-policy VPN-IMPORT
  set local-preference 200
  pass
end-policy
!

route-policy VPN-EXPORT
  pass
end-policy
!

!! --- QoS Policy ---
policy-map ENTERPRISE-QOS
 class VOICE-CLASS
  priority percent 30
  police rate percent 30
 !
 class CRITICAL-DATA
  bandwidth percent 40
 !
 class class-default
  bandwidth percent 30
  random-detect
 !
!

class-map match-any VOICE-CLASS
 match dscp ef
!
class-map match-any CRITICAL-DATA
 match dscp af31 af32 af33
!

interface GigabitEthernet0/0/0/0
 service-policy output ENTERPRISE-QOS
!

!! --- SSH and Management ---
ssh server v2
ssh server idle-time 10
ssh server session-limit 5

aaa new-model
aaa authentication login default local
aaa authorization exec default local

username admin
 group root-lr
 secret 0 Admin@123
!

!! --- Logging ---
logging console warnings
logging buffered 64000 informational
logging facility local7

!! --- NTP ---
ntp server 192.168.1.10 prefer

!! --- SNMP ---
snmp-server community lab-read RO
snmp-server host 192.168.10.100 traps version 2c lab-read

!! --- Banner ---
banner login "
=====================================================
  AUTHORIZED ACCESS ONLY - Vedakumara Lab IOS-XR
  Unauthorized access is strictly prohibited
=====================================================
"
end
