# ============================================================
# Fortinet FortiGate Firewall Configuration
# Project: Hybrid Enterprise Network Security Lab
# Device: FortiGate-01 (DMZ/Internal Segmentation)
# Author: Vedakumara K H
# ============================================================

config system global
    set hostname FortiGate-01
    set timezone 50
    set admintimeout 10
    set admin-ssh-port 22
    set gui-theme blue
end

# --- Interface Configuration ---
config system interface
    edit "wan1"
        set mode static
        set ip 203.0.113.5 255.255.255.0
        set allowaccess ping
        set role wan
        set description "WAN Interface - ISP Uplink"
    next
    edit "internal"
        set mode static
        set ip 192.168.30.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set description "Internal LAN Segment"
    next
    edit "dmz"
        set mode static
        set ip 192.168.40.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set description "DMZ Segment"
    next
end

# --- DNS ---
config system dns
    set primary 8.8.8.8
    set secondary 8.8.4.4
end

# --- Address Objects ---
config firewall address
    edit "INTERNAL-NET"
        set type iprange
        set start-ip 192.168.30.0
        set end-ip 192.168.30.255
        set comment "Internal LAN Subnet"
    next
    edit "DMZ-NET"
        set type iprange
        set start-ip 192.168.40.0
        set end-ip 192.168.40.255
        set comment "DMZ Subnet"
    next
    edit "AWS-VPC-NET"
        set type iprange
        set start-ip 10.0.1.0
        set end-ip 10.0.1.255
        set comment "AWS VPC CIDR via VPN"
    next
    edit "BLOCKED-COUNTRIES"
        set type geography
        set country "CN RU KP IR"
        set comment "Geo-blocked countries"
    next
end

# --- Service Objects ---
config firewall service custom
    edit "ENTERPRISE-APPS"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 8080-8090 9090-9095
        set comment "Internal enterprise application ports"
    next
end

# --- Firewall Policies ---
config firewall policy
    # Policy 1: Internal to Internet (allow with UTM)
    edit 1
        set name "INTERNAL-TO-INTERNET"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "INTERNAL-NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "PING"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set logtraffic all
        set comments "Allow internal users internet with UTM inspection"
        set nat enable
    next
    # Policy 2: Internal to DMZ (controlled access)
    edit 2
        set name "INTERNAL-TO-DMZ"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "INTERNAL-NET"
        set dstaddr "DMZ-NET"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "SSH"
        set logtraffic all
        set comments "Allow internal to access DMZ servers"
    next
    # Policy 3: DMZ to Internet (restricted)
    edit 3
        set name "DMZ-TO-INTERNET"
        set srcintf "dmz"
        set dstintf "wan1"
        set srcaddr "DMZ-NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set logtraffic all
        set nat enable
        set comments "DMZ servers limited internet access"
    next
    # Policy 4: Block DMZ to Internal
    edit 4
        set name "BLOCK-DMZ-TO-INTERNAL"
        set srcintf "dmz"
        set dstintf "internal"
        set srcaddr "DMZ-NET"
        set dstaddr "INTERNAL-NET"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Strict: DMZ must not reach internal LAN"
    next
    # Policy 5: VPN to Internal (AWS to on-prem)
    edit 5
        set name "AWS-VPN-TO-INTERNAL"
        set srcintf "vpn-to-aws"
        set dstintf "internal"
        set srcaddr "AWS-VPC-NET"
        set dstaddr "INTERNAL-NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Allow AWS VPC traffic to on-prem internal"
    next
    # Policy 6: Block geo-restricted countries
    edit 6
        set name "BLOCK-GEO-RESTRICTED"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "BLOCKED-COUNTRIES"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Block traffic from high-risk countries"
    next
end

# --- IPS Sensor ---
config ips sensor
    edit "enterprise-ips"
        set comment "Enterprise IPS policy for all traffic"
        config entries
            edit 1
                set rule 1000 1001 1002
                set action block
                set log enable
            next
        end
    next
end

# --- Site-to-Site VPN to AWS ---
config vpn ipsec phase1-interface
    edit "vpn-to-aws"
        set interface "wan1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set proposal aes256-sha256
        set dhgrp 14
        set remote-gw 52.x.x.x
        set psksecret AWS-VPN-PSK-HERE
        set dpd on-idle
        set dpd-retrycount 3
        set comments "IPSec VPN tunnel to AWS VPC"
    next
end

config vpn ipsec phase2-interface
    edit "vpn-to-aws-p2"
        set phase1name "vpn-to-aws"
        set proposal aes256-sha256
        set dhgrp 14
        set keylifeseconds 3600
        set src-subnet 192.168.30.0 255.255.255.0
        set dst-subnet 10.0.1.0 255.255.255.0
    next
end

# --- Logging to FortiAnalyzer/Syslog ---
config log syslogd setting
    set status enable
    set server "192.168.10.100"
    set mode reliable
    set port 514
    set facility local7
    set source-ip "192.168.30.1"
    set format default
end

config log syslogd filter
    set severity information
    set forward-traffic enable
    set local-traffic enable
    set deny-traffic enable
end

# --- Admin Hardening ---
config system admin
    edit "admin"
        set password Admin@123
        set trusthost1 192.168.30.0 255.255.255.0
        set trusthost2 10.0.0.0 255.255.255.0
        set accprofile "super_admin"
        set comments "Lab admin - restrict to management subnet only"
    next
end

config system password-policy
    set status enable
    set min-length 12
    set must-contain upper-case-letter lower-case-letter number non-alphanumeric
    set expire-status enable
    set expire-day 90
end
